<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}HertMusic{% endblock %}</title>
  <meta name="theme-color" content="#0a0806">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange: #FF5C00;
      --orange-2: #FF8533;
      --orange-3: #FFB380;
      --orange-glow: rgba(255,92,0,0.25);
      --orange-glow-sm: rgba(255,92,0,0.12);
      --bg: #0a0806;
      --bg-2: #130f0a;
      --bg-3: #1c1610;
      --bg-card: #181210;
      --bg-card-hover: #201810;
      --border: rgba(255,92,0,0.15);
      --border-hover: rgba(255,92,0,0.4);
      --text: #f0ebe4;
      --text-2: #b8a898;
      --text-3: #6e5d4e;
      --player-h: 88px;
      --radius: 16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(var(--player-h) + env(safe-area-inset-bottom, 0px) + 16px);
    }

    body::before {
      content: '';
      position: fixed;
      top: -30vh; left: -20vw;
      width: 70vw; height: 70vh;
      background: radial-gradient(ellipse, rgba(255,92,0,0.08) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: ambientDrift 20s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: 10vh; right: -15vw;
      width: 60vw; height: 60vh;
      background: radial-gradient(ellipse, rgba(255,133,51,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: ambientDrift 25s ease-in-out infinite alternate-reverse;
    }
    @keyframes ambientDrift {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(5vw,5vh) scale(1.1); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-2); }
    ::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 2px; }

    h1,h2,h3,h4,h5 { font-family: 'Syne', sans-serif; letter-spacing: -0.02em; }

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 64px;
      background: rgba(10,8,6,0.88);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-bottom: 1px solid var(--border);
    }
    .navbar-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
      letter-spacing: -0.03em; color: var(--text);
    }
    .navbar-brand .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-2) 100%);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 0 16px var(--orange-glow);
    }
    .brand-hert { color: var(--orange); }

    .navbar-nav { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      font-size: 13px; font-weight: 600; color: var(--text-2);
      text-decoration: none; padding: 7px 12px;
      border-radius: var(--radius-sm); border: 1px solid transparent;
      transition: all 0.2s; cursor: pointer; background: none;
      font-family: 'Manrope', sans-serif;
    }
    .nav-link:hover { color: var(--text); background: var(--bg-3); border-color: var(--border); }
    .nav-link.active { color: var(--orange); }
    .nav-btn {
      font-size: 13px; font-weight: 600; color: var(--bg);
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-2) 100%);
      text-decoration: none; padding: 8px 18px; border-radius: var(--radius-sm);
      transition: all 0.2s; box-shadow: 0 4px 16px var(--orange-glow);
    }
    .nav-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,92,0,0.4); }
    .nav-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
    .nav-user .avatar {
      width: 30px; height: 30px; background: var(--bg-3);
      border: 1px solid var(--border); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--orange);
    }

    /* ── SPA content area ── */
    #spa-root {
      position: relative; z-index: 1;
      max-width: 1320px; margin: 0 auto; padding: 32px 20px;
    }
    .spa-page { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ── Page load indicator ── */
    #page-loader {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--orange), var(--orange-2));
      z-index: 9999; transform: scaleX(0); transform-origin: left;
      transition: transform 0.3s ease; opacity: 0;
    }
    #page-loader.loading { opacity: 1; transform: scaleX(0.7); }
    #page-loader.done { transform: scaleX(1); opacity: 0; transition: transform 0.2s, opacity 0.3s 0.2s; }

    /* ── Song Grid ── */
    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    @media (max-width: 480px) {
      .songs-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }

    /* ── Song Card ── */
    .song-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      position: relative; overflow: hidden;
      animation: cardIn 0.4s ease both;
    }
    @keyframes cardIn { from { opacity:0; transform: translateY(20px) scale(0.96); } to { opacity:1; transform:none; } }
    .song-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--orange-glow-sm) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.25s;
    }
    .song-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    .song-card:hover::before { opacity: 1; }
    .song-card.playing { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange), 0 8px 32px var(--orange-glow); }

    .song-cover-wrap { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: var(--bg-3); }
    .song-cover { width:100%; height:100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .song-card:hover .song-cover { transform: scale(1.04); }
    .cover-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-2) 100%); font-size:40px; }

    .eq-bars { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; gap:3px; padding:16px; background:rgba(0,0,0,0.55); opacity:0; transition:opacity 0.2s; }
    .song-card.playing .eq-bars { opacity:1; }
    .eq-bar { width:4px; background:var(--orange); border-radius:2px; animation: eqBounce 0.6s ease-in-out infinite alternate; }
    .eq-bar:nth-child(1){animation-delay:0s}.eq-bar:nth-child(2){animation-delay:0.1s}.eq-bar:nth-child(3){animation-delay:0.2s}.eq-bar:nth-child(4){animation-delay:0.05s}
    @keyframes eqBounce { from{height:6px} to{height:28px} }

    .song-play-btn {
      position:absolute; bottom:8px; right:8px; width:40px; height:40px;
      background:var(--orange); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      opacity:0; transform:translateY(6px); transition:all 0.2s;
      box-shadow:0 4px 16px rgba(0,0,0,0.5); border:none; cursor:pointer; color:white;
    }
    .song-card:hover .song-play-btn, .song-card.playing .song-play-btn { opacity:1; transform:translateY(0); }
    .song-play-btn svg { width:18px; height:18px; }

    .song-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-artist { font-size:12px; font-weight:500; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── Section header ── */
    .section-header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; gap:12px; }
    .section-title { font-size:clamp(22px,4vw,32px); font-weight:800; color:var(--text); }
    .section-subtitle { font-size:13px; color:var(--text-3); margin-top:4px; font-weight:500; }

    /* ── Empty state ── */
    .empty-state { text-align:center; padding:80px 20px; color:var(--text-3); }
    .empty-state .icon { font-size:56px; margin-bottom:20px; }
    .empty-state h3 { font-family:'Syne',sans-serif; font-size:22px; color:var(--text-2); margin-bottom:8px; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:'Manrope',sans-serif; font-size:14px; font-weight:700; padding:10px 22px; border-radius:var(--radius-sm); border:none; cursor:pointer; text-decoration:none; transition:all 0.2s; line-height:1; }
    .btn-primary { background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 100%); color:#fff; box-shadow:0 4px 16px var(--orange-glow); }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 24px rgba(255,92,0,0.5); }
    .btn-secondary { background:var(--bg-3); color:var(--text-2); border:1px solid var(--border); }
    .btn-secondary:hover { color:var(--text); border-color:var(--border-hover); }
    .btn-ghost { background:transparent; color:var(--orange); border:1px solid var(--border-hover); }
    .btn-ghost:hover { background:var(--orange-glow-sm); }
    .btn-sm { font-size:12px; padding:7px 14px; }
    .btn-danger { background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background:rgba(239,68,68,0.22); }

    /* ── Forms ── */
    .form-group { margin-bottom:20px; }
    .form-label { display:block; font-size:12px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }
    .form-input, .form-select {
      width:100%; background:var(--bg-2); border:1px solid var(--border);
      border-radius:var(--radius-sm); color:var(--text);
      font-family:'Manrope',sans-serif; font-size:14px; font-weight:500;
      padding:12px 16px; outline:none; transition:border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus, .form-select:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-glow-sm); }
    .form-input::placeholder { color:var(--text-3); }
    .form-select { cursor:pointer; appearance:none; }
    .form-textarea { resize:vertical; min-height:80px; }
    .error-msg { display:inline-block; background:rgba(255,60,60,0.12); color:#ff6b6b; border:1px solid rgba(255,60,60,0.3); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:20px; }
    .success-msg { display:inline-block; background:rgba(0,200,100,0.1); color:#4ddb8f; border:1px solid rgba(0,200,100,0.25); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:20px; }

    /* ── Panel ── */
    .panel { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:28px; }

    /* ── Playlist cards ── */
    .playlists-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    @media(max-width:480px){ .playlists-grid{grid-template-columns:1fr 1fr; gap:10px;} }
    .playlist-card {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
      padding:18px; cursor:pointer; transition:all 0.2s; position:relative;
    }
    .playlist-card:hover { border-color:var(--border-hover); transform:translateY(-2px); background:var(--bg-card-hover); }
    .playlist-cover {
      width:100%; aspect-ratio:1; border-radius:10px; overflow:hidden;
      margin-bottom:12px; background:var(--bg-3);
      display:grid; grid-template-columns:1fr 1fr; gap:2px;
    }
    .playlist-cover img { width:100%; height:100%; object-fit:cover; }
    .playlist-cover .cover-single { grid-column:1/-1; grid-row:1/-1; }
    .playlist-cover-empty { width:100%; aspect-ratio:1; border-radius:10px; background:var(--bg-3); display:flex; align-items:center; justify-content:center; font-size:40px; margin-bottom:12px; }
    .playlist-name { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .playlist-meta { font-size:12px; color:var(--text-3); display:flex; align-items:center; gap:6px; }
    .badge-public { background:rgba(255,92,0,0.15); color:var(--orange); font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; }
    .badge-private { background:rgba(100,100,100,0.15); color:var(--text-3); font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; }

    /* ── Playlist detail ── */
    .pl-header { display:flex; gap:24px; align-items:flex-start; margin-bottom:32px; flex-wrap:wrap; }
    .pl-header-cover { width:160px; height:160px; border-radius:var(--radius); overflow:hidden; flex-shrink:0; background:var(--bg-3); display:flex; align-items:center; justify-content:center; font-size:60px; }
    .pl-header-info { flex:1; min-width:0; }
    .pl-header-info h1 { font-size:clamp(24px,5vw,40px); font-weight:800; }
    .pl-header-info .meta { color:var(--text-2); font-size:13px; margin-top:8px; }
    .pl-song-list { display:flex; flex-direction:column; gap:8px; }
    .pl-song-row {
      display:flex; align-items:center; gap:12px;
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:10px 14px;
      cursor:pointer; transition:all 0.15s;
    }
    .pl-song-row:hover { border-color:var(--border-hover); background:var(--bg-card-hover); }
    .pl-song-row.playing { border-color:var(--orange); }
    .pl-song-num { width:20px; text-align:right; font-size:12px; color:var(--text-3); flex-shrink:0; }
    .pl-song-cover { width:40px; height:40px; border-radius:7px; object-fit:cover; flex-shrink:0; background:var(--bg-3); }
    .pl-song-info { flex:1; min-width:0; }
    .pl-song-title { font-size:14px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pl-song-artist { font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pl-song-remove { background:none; border:none; color:var(--text-3); cursor:pointer; padding:4px; border-radius:6px; line-height:0; transition:color 0.15s; flex-shrink:0; }
    .pl-song-remove:hover { color:#f87171; }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:500;
      display:flex; align-items:center; justify-content:center; padding:16px;
      backdrop-filter:blur(6px); animation:fadeIn 0.2s ease;
    }
    .modal { background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius); padding:28px; width:100%; max-width:440px; position:relative; }
    .modal-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; margin-bottom:20px; }
    .modal-close { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--text-3); cursor:pointer; font-size:20px; line-height:1; padding:4px; }
    .modal-close:hover { color:var(--text); }

    /* ── Search ── */
    .search-wrap { position:relative; margin-bottom:24px; }
    .search-input {
      width:100%; background:var(--bg-2); border:1px solid var(--border);
      border-radius:var(--radius-sm); color:var(--text);
      font-family:'Manrope',sans-serif; font-size:14px; font-weight:500;
      padding:12px 16px 12px 44px; outline:none; transition:border-color 0.2s;
    }
    .search-input:focus { border-color:var(--orange); }
    .search-input::placeholder { color:var(--text-3); }
    .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-3); pointer-events:none; }

    /* ── Bottom Player ── */
    #player {
      position:fixed; bottom:0; left:0; right:0;
      height:var(--player-h); z-index:200;
      background:rgba(12,9,6,0.92);
      backdrop-filter:blur(32px) saturate(150%);
      -webkit-backdrop-filter:blur(32px) saturate(150%);
      border-top:1px solid var(--border);
      display:flex; align-items:center; padding:0 20px; gap:16px;
      padding-bottom:env(safe-area-inset-bottom,0px);
      transform:translateY(100%); transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    #player.visible { transform:translateY(0); }
    .player-cover { width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--bg-3); border:1px solid var(--border); }
    .player-cover-placeholder { width:52px; height:52px; border-radius:10px; flex-shrink:0; background:var(--bg-3); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; }
    .player-info { flex:1; min-width:0; }
    .player-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-artist { font-size:12px; font-weight:500; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .player-controls { display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .ctrl-btn { width:36px; height:36px; background:none; border:none; cursor:pointer; color:var(--text-2); display:flex; align-items:center; justify-content:center; border-radius:50%; transition:all 0.15s; padding:0; }
    .ctrl-btn:hover { color:var(--text); background:var(--bg-3); }
    .ctrl-btn svg { width:20px; height:20px; }
    .ctrl-btn.play-pause { width:44px; height:44px; background:var(--orange); color:white; box-shadow:0 4px 16px var(--orange-glow); }
    .ctrl-btn.play-pause:hover { background:var(--orange-2); transform:scale(1.06); }
    .ctrl-btn.play-pause svg { width:22px; height:22px; }
    .player-progress-wrap { flex:2; min-width:80px; max-width:340px; display:flex; align-items:center; gap:8px; }
    .player-time { font-size:11px; font-weight:600; color:var(--text-3); width:34px; flex-shrink:0; font-variant-numeric:tabular-nums; }
    .player-time.right { text-align:right; }
    .progress-bar { flex:1; height:4px; background:var(--bg-3); border-radius:2px; cursor:pointer; position:relative; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--orange) 0%,var(--orange-2) 100%); border-radius:2px; width:0%; position:relative; transition:width 0.1s linear; }
    .progress-fill::after { content:''; position:absolute; right:-5px; top:-4px; width:12px; height:12px; background:white; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.4); opacity:0; transition:opacity 0.15s; }
    .progress-bar:hover .progress-fill::after { opacity:1; }
    .player-volume { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    @media(max-width:600px){ .player-volume,.player-progress-wrap .player-time{display:none;} .player-controls{gap:6px;} .ctrl-btn{width:30px;height:30px;} .ctrl-btn.play-pause{width:40px;height:40px;} }

    .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--orange); border-radius:50%; animation:spin 0.6s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .tg-app .navbar { background:transparent; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<div id="page-loader"></div>

<nav class="navbar">
  <a href="/" class="navbar-brand spa-link">
    <div class="logo-icon">🎵</div>
    <span><span class="brand-hert">Hert</span>Music</span>
  </a>
  <div class="navbar-nav">
    {% if user %}
      <a href="/" class="nav-link spa-link" data-path="/">Музыка</a>
      <a href="/playlists" class="nav-link spa-link" data-path="/playlists">Плейлисты</a>
      <a href="/upload" class="nav-link spa-link" data-path="/upload">Загрузить</a>
      {% if is_admin %}<a href="/admin" class="nav-link spa-link" data-path="/admin">Модерация</a>{% endif %}
      <div class="nav-user">
        <div class="avatar">{{ (user.telegram_first_name or '?')[0].upper() }}</div>
      </div>
      <a href="/logout" class="nav-link spa-link" style="color:var(--text-3);font-size:12px;">Выйти</a>
    {% else %}
      <a href="/login" class="nav-btn spa-link">Войти</a>
    {% endif %}
  </div>
</nav>

<div id="spa-root">
  <div class="spa-page" id="spa-content">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- Bottom Player -->
<div id="player">
  <div id="player-cover-wrap">
    <div class="player-cover-placeholder" id="player-cover-placeholder">🎵</div>
  </div>
  <div class="player-info">
    <div class="player-title" id="player-title">—</div>
    <div class="player-artist" id="player-artist">—</div>
  </div>
  <div class="player-progress-wrap">
    <span class="player-time" id="player-current">0:00</span>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="player-time right" id="player-duration">0:00</span>
  </div>
  <div class="player-controls">
    <button class="ctrl-btn" id="btn-prev">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-pause" id="btn-play">
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn" id="btn-next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
    </button>
  </div>
  <div class="player-volume">
    <button class="ctrl-btn" id="btn-mute">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </button>
    <input type="range" id="volume-slider" min="0" max="100" value="80"
           style="width:70px; accent-color:var(--orange); cursor:pointer;">
  </div>
</div>

<audio id="audio-el" preload="metadata"></audio>

<script>
// ─── Player ──────────────────────────────────────────────────────────────────
const audio = document.getElementById("audio-el");
const player = document.getElementById("player");
const btnPlay = document.getElementById("btn-play");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const btnMute = document.getElementById("btn-mute");
const iconPlay = document.getElementById("icon-play");
const iconPause = document.getElementById("icon-pause");
const progressBar = document.getElementById("progress-bar");
const progressFill = document.getElementById("progress-fill");
const playerTitle = document.getElementById("player-title");
const playerArtist = document.getElementById("player-artist");
const playerCoverWrap = document.getElementById("player-cover-wrap");
const playerCoverPlaceholder = document.getElementById("player-cover-placeholder");
const playerCurrent = document.getElementById("player-current");
const playerDuration = document.getElementById("player-duration");
const volSlider = document.getElementById("volume-slider");

let playlist = [];
let currentIndex = -1;
let isDragging = false;

function fmtTime(s) {
  if (!isFinite(s) || s < 0) return "0:00";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

function playSong(song, idx) {
  currentIndex = idx;
  audio.src = song.audio_url;
  playerTitle.textContent = song.title;
  playerArtist.textContent = song.artist;

  const existingImg = playerCoverWrap.querySelector("img");
  if (existingImg) existingImg.remove();
  playerCoverPlaceholder.style.display = "flex";
  const img = document.createElement("img");
  img.className = "player-cover";
  img.src = song.cover_url;
  img.onload = () => { playerCoverPlaceholder.style.display = "none"; playerCoverWrap.appendChild(img); };

  player.classList.add("visible");
  audio.play().catch(() => {});
  updatePlayState(true);
  highlightCard(idx);

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      artwork: [{ src: song.cover_url, sizes: "512x512", type: "image/jpeg" }]
    });
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("previoustrack", () => btnPrev.click());
    navigator.mediaSession.setActionHandler("nexttrack", () => btnNext.click());
  }
}

function updatePlayState(playing) {
  iconPlay.style.display = playing ? "none" : "block";
  iconPause.style.display = playing ? "block" : "none";
}

function highlightCard(idx) {
  document.querySelectorAll(".song-card, .pl-song-row").forEach((c, i) => {
    c.classList.toggle("playing", i === idx);
  });
}

btnPlay.addEventListener("click", () => { if (audio.src) audio.paused ? audio.play() : audio.pause(); });
btnPrev.addEventListener("click", () => {
  if (!playlist.length) return;
  const i = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
  playSong(playlist[i], i);
});
btnNext.addEventListener("click", () => {
  if (!playlist.length) return;
  const i = currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
  playSong(playlist[i], i);
});
audio.addEventListener("ended", () => btnNext.click());
audio.addEventListener("play", () => updatePlayState(true));
audio.addEventListener("pause", () => updatePlayState(false));
audio.addEventListener("timeupdate", () => {
  if (!isDragging && audio.duration) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + "%";
    playerCurrent.textContent = fmtTime(audio.currentTime);
  }
});
audio.addEventListener("loadedmetadata", () => { playerDuration.textContent = fmtTime(audio.duration); });

progressBar.addEventListener("mousedown", startDrag);
progressBar.addEventListener("touchstart", startDrag, { passive: true });
function startDrag(e) {
  isDragging = true; seek(e);
  document.addEventListener("mousemove", seek);
  document.addEventListener("touchmove", seek, { passive: true });
  document.addEventListener("mouseup", endDrag);
  document.addEventListener("touchend", endDrag);
}
function seek(e) {
  const t = e.touches ? e.touches[0] : e;
  const rect = progressBar.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (t.clientX - rect.left) / rect.width));
  progressFill.style.width = (pct * 100) + "%";
  if (audio.duration) playerCurrent.textContent = fmtTime(pct * audio.duration);
}
function endDrag(e) {
  isDragging = false;
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const rect = progressBar.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (t.clientX - rect.left) / rect.width));
  if (audio.duration) audio.currentTime = pct * audio.duration;
  document.removeEventListener("mousemove", seek);
  document.removeEventListener("touchmove", seek);
  document.removeEventListener("mouseup", endDrag);
  document.removeEventListener("touchend", endDrag);
}
btnMute.addEventListener("click", () => { audio.muted = !audio.muted; });
volSlider.addEventListener("input", () => { audio.volume = volSlider.value / 100; audio.muted = false; });

// ─── SPA Navigation (музыка не прерывается) ──────────────────────────────────
const loader = document.getElementById("page-loader");

function setActiveNav(path) {
  document.querySelectorAll(".nav-link[data-path]").forEach(a => {
    a.classList.toggle("active", a.dataset.path === path);
  });
}

async function spaNavigate(url, push = true) {
  loader.className = "loading";
  try {
    const res = await fetch(url, { headers: { "X-SPA": "1" }, credentials: "include" });
    // If server returns redirect (login page etc) — do hard nav
    if (res.redirected || res.url !== location.origin + url && !res.url.startsWith(location.origin + url)) {
      window.location.href = url;
      return;
    }
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const newContent = doc.querySelector("#spa-content");
    const newTitle = doc.querySelector("title");
    if (!newContent) { window.location.href = url; return; }

    document.getElementById("spa-content").replaceWith(newContent);
    if (newTitle) document.title = newTitle.textContent;
    if (push) history.pushState({ url }, "", url);
    setActiveNav(new URL(url, location.origin).pathname);

    // Re-run page scripts
    const scripts = newContent.querySelectorAll("script");
    scripts.forEach(s => {
      const ns = document.createElement("script");
      ns.textContent = s.textContent;
      document.body.appendChild(ns);
    });

    window.scrollTo(0, 0);
  } catch(e) {
    window.location.href = url;
  }
  loader.className = "done";
  setTimeout(() => { loader.className = ""; }, 500);
}

// Intercept all spa-link clicks
document.addEventListener("click", e => {
  const a = e.target.closest("a.spa-link");
  if (!a) return;
  e.preventDefault();
  const url = a.getAttribute("href");
  if (url && url !== location.pathname + location.search) {
    spaNavigate(url);
  }
});

// Back/forward buttons
window.addEventListener("popstate", e => {
  if (e.state && e.state.url) spaNavigate(e.state.url, false);
});

// Set initial state
history.replaceState({ url: location.pathname }, "", location.pathname);
setActiveNav(location.pathname);

// ─── Telegram WebApp auth ────────────────────────────────────────────────────
(async function() {
  if (!window.Telegram || !window.Telegram.WebApp) return;
  const twa = window.Telegram.WebApp;
  twa.ready(); twa.expand();
  document.body.classList.add("tg-app");
  const initData = twa.initData;
  if (!initData) return;
  const isLoggedIn = {{ 'true' if user else 'false' }};
  if (isLoggedIn) return;
  try {
    const res = await fetch("/api/tg-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ initData })
    });
    if (!res.ok) return;
    const json = await res.json();
    if (json.ok && json.token) {
      window.location.href = "/api/tg-login?token=" + encodeURIComponent(json.token);
    }
  } catch(e) {}
})();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
